<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>چامه | برای کسانی که دوست دارند شعر خوب بخوانند</title>

<!-- Ravi Font -->
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/ravi-font@v1.0.0/dist/font-face.css" rel="stylesheet">

<style>
:root{
    --gold:#d4af37;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Ravi',sans-serif;

    /* فقط این خط تغییر کرد: سیاه → سفید */
    background:#ffffff;

    min-height:100vh;
    color:#111;
}

/* --- فقط اضافه شده برای لوگوی بک‌گراند --- */
body::before{
    content:"";
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:420px;
    height:420px;
    background:url('logo.png') no-repeat center/contain;
    opacity:0.06;
    filter:blur(1px);
    animation:float 6s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
}

@keyframes float{
    0%{
        transform:translate(-50%,-50%) scale(1);
    }
    50%{
        transform:translate(-50%,-52%) scale(1.05);
    }
    100%{
        transform:translate(-50%,-50%) scale(1);
    }
}
/* --- پایان بخش اضافه --- */

.container{
    width:min(90%,700px);
    margin:auto;
    padding:40px 0;
    text-align:center;

    position:relative;
    z-index:1;
}

.logo{
    width:140px;
    margin:auto;
    display:block;
}

h1{
    font-size:3rem;
    margin-top:10px;
}

.tagline{
    margin-top:10px;
    color:#555;
}

.card{
    margin-top:25px;
    background:rgba(0,0,0,.05);
    padding:20px;
    border-radius:20px;
}

a{
    display:block;
    color:#111;
    text-decoration:none;
    padding:12px;
    margin-top:10px;
    background:rgba(0,0,0,.05);
    border-radius:12px;
}

a:hover{
    background:rgba(0,0,0,.1);
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>چامه</h1>
<p class="tagline">برای کسانی که دوست دارند شعر خوب بخوانند</p>

<div class="card">

<a href="https://ble.ir/chaame">بله</a>
<a href="https://splus.ir/chaame">سروش</a>
<a href="https://eitaa.com/chaame">ایتا</a>
<a href="https://rubika.ir/rubika_chaame">روبیکا</a>
<a href="https://t.me/chaame">تلگرام</a>

</div>

</div>

</body>
</html>
