<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چامه | شعر و ادبیات</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Vazirmatn", sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
}

/* Header */
header{
  text-align:center;
  padding:60px 20px 30px;
}

header h1{
  font-size:42px;
  margin:0;
  font-weight:800;
}

header p{
  opacity:0.8;
  margin-top:10px;
}

/* Container */
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

/* Card */
.card{
  background: rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;
  padding:20px;
  backdrop-filter: blur(10px);
  transition:0.3s;
}

.card:hover{
  transform: translateY(-5px);
  background: rgba(255,255,255,0.12);
}

.card h3{
  margin-top:0;
}

.card p{
  opacity:0.85;
  line-height:1.8;
}

/* Button */
.btn{
  display:inline-block;
  margin-top:10px;
  padding:8px 14px;
  background:#3b82f6;
  color:white;
  border-radius:10px;
  text-decoration:none;
  font-size:14px;
}
</style>

</head>
<body>

<header>
  <h1>چامه</h1>
  <p>برای کسانی که شعر خوب را زندگی می‌کنند</p>
</header>

<div class="container">

  <div class="card">
    <h3>شعر امروز</h3>
    <p>چند شعر جدید و احساسی برای حال و هوای امشب...</p>
    <a class="btn" href="#">مشاهده</a>
  </div>

  <div class="card">
    <h3>حافظ</h3>
    <p>غزل‌های کلاسیک با تفسیر ساده و روان</p>
    <a class="btn" href="#">ورود</a>
  </div>

  <div class="card">
    <h3>مولانا</h3>
    <p>شعرهایی برای آرامش و معنا</p>
    <a class="btn" href="#">بخوان</a>
  </div>

</div>

</body>
</html>
