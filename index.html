<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چامه</title>

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:sans-serif;
    background:#070a12;
}

/* BACKGROUND LOGO */
.bg-logo{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:420px;
    opacity:0.08;
    filter: blur(0.5px) drop-shadow(0 0 40px rgba(255,255,255,0.2));
    animation: float 6s ease-in-out infinite;
    pointer-events:none;
}

/* soft glow layer */
.glow{
    position:absolute;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 60%),
        radial-gradient(circle at 30% 30%, rgba(120,180,255,0.08), transparent 50%),
        radial-gradient(circle at 70% 70%, rgba(255,200,120,0.06), transparent 55%);
}

/* floating animation */
@keyframes float{
    0%{
        transform:translate(-50%,-50%) scale(1);
    }
    50%{
        transform:translate(-50%,-52%) scale(1.05);
    }
    100%{
        transform:translate(-50%,-50%) scale(1);
    }
}

/* content */
.content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}

h1{
    font-size:3rem;
    margin:0;
}

p{
    opacity:0.7;
}

</style>
</head>

<body>

<div class="glow"></div>

<img src="logo.png" class="bg-logo">

<div class="content">
    <h1>چامه</h1>
    <p>برای کسانی که شعر را زندگی می‌کنند</p>
</div>

</body>
</html>
