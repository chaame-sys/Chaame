<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>چامه</title>

<!-- Ravi Font -->
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/ravi-font@v1.0.0/dist/font-face.css" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
  margin:0;
  font-family: "Ravi", sans-serif;
  background: linear-gradient(135deg,#0b1220,#1f2a44);
  color:white;
}

/* Header */
header{
  text-align:center;
  padding:50px 20px;
}

header h1{
  font-size:40px;
  margin:0;
}

header p{
  opacity:0.8;
}

/* Logos row */
.logo-bar{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:20px;
  flex-wrap:wrap;
}

.logo-bar img{
  width:60px;
  height:60px;
  object-fit:contain;
  filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
}

/* Cards */
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
}

/* Social icons */
.social{
  display:flex;
  justify-content:center;
  gap:18px;
  margin:30px 0;
}

.social a{
  color:white;
  font-size:22px;
  width:45px;
  height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(255,255,255,0.1);
  transition:0.3s;
  text-decoration:none;
}

.social a:hover{
  background:#3b82f6;
  transform:scale(1.1);
}

</style>
</head>

<body>

<header>
  <h1>چامه</h1>
  <p>برای کسانی که شعر را زندگی می‌کنند</p>

  <!-- Logos -->
  <div class="logo-bar">
    <img src="logo1.png" alt="logo">
    <img src="logo2.png" alt="logo">
    <img src="logo3.png" alt="logo">
  </div>
</header>

<!-- Social media -->
<div class="social">
  <a href="#"><i class="fab fa-telegram"></i></a>
  <a href="#"><i class="fab fa-instagram"></i></a>
  <a href="#"><i class="fab fa-whatsapp"></i></a>
  <a href="#"><i class="fab fa-twitter"></i></a>
</div>

<div class="container">

  <div class="card">
    <h3>شعر امروز</h3>
    <p>مجموعه‌ای از شعرهای جدید و احساسی</p>
  </div>

  <div class="card">
    <h3>حافظ</h3>
    <p>غزل‌های کلاسیک با توضیح ساده</p>
  </div>

  <div class="card">
    <h3>مولانا</h3>
    <p>شعرهای عرفانی و عمیق</p>
  </div>

</div>

</body>
</html>
